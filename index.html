<script id="gen">
var QuizGen=(function(){
'use strict';
var MINUS='\u2212',TIMES='\u00d7',DIV='\u00f7';
var PREC={'+':1,'\u2212':1,'\u00d7':2,'\u00f7':2};
var KIND_LABELS={addsub:'Adding & subtracting',muldiv:'Multiplying & dividing',twostep:'Two-step puzzles',parens:'Parentheses',both:'Mystery number on both sides',order:'Order of operations',multi:'Multi-step challenges'};
var LEVEL_NAMES=['Number Newbie','Times-Table Tiger','Number Ninja','Puzzle Solver','Equation Explorer','Brain Builder','Balance Master','Parentheses Pro','Algebra Ace','Math Wizard','Challenge Champ','Math Legend'];
var POOLS={
 1:[['addsub',0]],
 2:[['muldiv',0]],
 3:[['addsub',1],['muldiv',1]],
 4:[['twostep',0]],
 5:[['twostep',1],['parens',0]],
 6:[['both',0],['order',0]],
 7:[['both',1],['parens',1]],
 8:[['multi',0],['order',1],['twostep',2]],
 9:[['both',2],['multi',1]],
 10:[['both',3],['multi',2],['order',1]],
 /* 11-12: bonus levels, reachable in Practice only (the daily quiz stays on levels 1-10) */
 11:[['both',3],['multi',3]],
 12:[['both',3],['multi',3],['twostep',3],['order',2]]
};
/* ---------- random ---------- */
function hashSeed(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
 h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;}

function ri(r,a,b){return a+Math.floor(r()*(b-a+1));}
function pick(r,a){return a[Math.floor(r()*a.length)];}
function shuffle(r,a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* ---------- expression trees ---------- */
function N(n){return {t:'n',v:n};}
function V(){return {t:'v'};}
function B(op,a,b,par){return {t:'o',op:op,a:a,b:b,par:!!par};}
function hasV(n){return n.t==='v'||(n.t==='o'&&(hasV(n.a)||hasV(n.b)));}
function needs(c,p,isRight){if(c.t!=='o')return false;if(c.par)return true;if(PREC[c.op]<PREC[p.op])return true;
 if(isRight&&PREC[c.op]===PREC[p.op]&&(p.op===MINUS||p.op===DIV))return true;return false;}

 var l=show(n.a,name),r=show(n.b,name);if(needs(n.a,n,false))l='('+l+')';if(needs(n.b,n,true))r='('+r+')';return l+' '+n.op+' '+r;}
function evalN(n,val){if(n.t==='n')return n.v;if(n.t==='v')return val;
 var a=evalN(n.a,val);if(a===null)return null;var b=evalN(n.b,val);if(b===null)return null;var r;
 if(n.op==='+')r=a+b;else if(n.op===MINUS)r=a-b;else if(n.op===TIMES)r=a*b;else{if(b===0||a%b!==0)return null;r=a/b;}
 return r<0?null:r;}
function subst(n,val){if(n.t==='n')return N(n.v);if(n.t==='v')return N(val);return {t:'o',op:n.op,a:subst(n.a,val),b:subst(n.b,val),par:n.par};}
function collect(n,depth,out){if(n.t!=='o')return;
 collect(n.a,depth+(needs(n.a,n,false)?1:0),out);
 if(n.a.t==='n'&&n.b.t==='n')out.push({node:n,depth:depth});
 collect(n.b,depth+(needs(n.b,n,true)?1:0),out);}

 while(n.t==='o'&&guard++<20){var c=[];collect(n,0,c);var best=null;
  for(var i=0;i<c.length;i++){var x=c[i];if(!best||x.depth>best.depth||(x.depth===best.depth&&PREC[x.node.op]>PREC[best.node.op]))best=x;}
  var nd=best.node;var before=show(nd,'?');var val=evalN(nd,0);
  nd.t='n';nd.v=val;delete nd.a;delete nd.b;delete nd.op;
  steps.push({what:before+' = '+val,now:n.t==='n'?'':show(n,'?')});}
 return {steps:steps,value:evalN(n,0)};}
/* ---------- unwinding (opposite operations) ---------- */
function unwind(node,T,name){var pre=[],lines=[],chain=[],cur=node,target=T;
 while(cur.t==='o'){var varLeft=hasV(cur.a);var sub=varLeft?cur.a:cur.b,other=varLeft?cur.b:cur.a;var c=evalN(other,0);
  if(other.t==='o')pre.push('First work out the number part: '+show(other,name)+' = '+c+'.');
  var nw,txt,op=cur.op;
  if(op==='+'){nw=target-c;txt='Undo "+ '+c+'" with its opposite, "'+MINUS+' '+c+'":  '+target+' '+MINUS+' '+c+' = '+nw;}
  else if(op===MINUS){
   if(varLeft){nw=target+c;txt='Undo "'+MINUS+' '+c+'" with its opposite, "+ '+c+'":  '+target+' + '+c+' = '+nw;}
   else{nw=c-target;txt=c+' '+MINUS+' ? = '+target+'. What did we take away from '+c+'? '+c+' '+MINUS+' '+target+' = '+nw;}}
  else if(op===TIMES){nw=target/c;txt='Undo "'+TIMES+' '+c+'" with its opposite, "'+DIV+' '+c+'":  '+target+' '+DIV+' '+c+' = '+nw;}
  else{
   if(varLeft){nw=target*c;txt='Undo "'+DIV+' '+c+'" with its opposite, "'+TIMES+' '+c+'":  '+target+' '+TIMES+' '+c+' = '+nw;}
   else{nw=c/target;txt=c+' '+DIV+' ? = '+target+'. How many in each group? '+c+' '+DIV+' '+target+' = '+nw;}}
  chain.push({op:op,varLeft:varLeft,c:c});
  lines.push(txt+'   \u2192   '+show(sub,name)+' = '+nw);
  cur=sub;target=nw;}
 return {pre:pre,lines:lines,chain:chain,answer:target};}
function chainRun(chain,T,wrongAt){var val=T;
 for(var i=0;i<chain.length;i++){var s=chain[i],c=s.c,w=(i===wrongAt),res;
  if(s.op==='+')res=w?val+c:val-c;

  else if(s.op===TIMES){if(w)res=val*c;else{if(val%c!==0)return null;res=val/c;}}
  else{if(s.varLeft){if(w){if(val%c!==0)return null;res=val/c;}else res=val*c;}
   else{if(w)res=c*val;else{if(val===0||c%val!==0)return null;res=c/val;}}}
  if(res<0||res!==Math.floor(res))return null;val=res;}

/* ---------- both-sides explanation: a*x + b = c*x + d ---------- */
function xs(k,vn){return k===1?vn:k+' '+TIMES+' '+vn;}
function linLines(lin,vn,pre){var a=lin.a,b=lin.b,c=lin.c,d=lin.d,k=a-c,L=[];
 if(pre)for(var i=0;i<pre.length;i++)L.push(pre[i]);
 L.push('Both sides have '+vn+'. To keep things balanced, take away '+xs(c,vn)+' from BOTH sides:   '+xs(k,vn)+(b>=0?' + '+b:' '+MINUS+' '+(-b))+' = '+d);
 var e;
 if(b>0){e=d-b;L.push('Undo "+ '+b+'" with its opposite, "'+MINUS+' '+b+'":  '+d+' '+MINUS+' '+b+' = '+e+'   \u2192   '+xs(k,vn)+' = '+e);}
 else if(b<0){e=d-b;L.push('Undo "'+MINUS+' '+(-b)+'" with its opposite, "+ '+(-b)+'":  '+d+' + '+(-b)+' = '+e+'   \u2192   '+xs(k,vn)+' = '+e);}
 else e=d;
 if(k>1){L.push('Undo "'+TIMES+' '+k+'" with its opposite, "'+DIV+' '+k+'":  '+e+' '+DIV+' '+k+' = '+(e/k)+'   \u2192   '+vn+' = '+(e/k));}
 return {lines:L,answer:e/k};}
/* ---------- kinds ---------- */
function term(r,a){if(a===1)return V();return r()<0.5?B(TIMES,N(a),V()):B(TIMES,V(),N(a));}

  else{T=ri(r,2,12);s=ri(r,2,12);L=B(DIV,N(T*s),V());}}

['mindset',2,'Sam\u2019s friend is great at drawing, and Sam feels a little jealous.','What is a helpful thing for Sam to think?','\u201CI can ask how my friend got so good and practice too.\u201D','\u201CI\u2019ll never be good at drawing, so why try?\u201D','Other people\u2019s skills can show you what is possible and give you ideas to learn from.'],
['mindset',2,'Maya got an A on a test without studying, then a hard new topic came up.','What should Maya do about the hard topic?','Use study strategies, because hard things need effort.','Decide she is not smart because it is hard.','Learning new, hard things takes effort for everyone. Strategies make it easier.'],
['mindset',2,'Ben missed a goal in soccer.','What helps him get better?','Ask a coach for tips and practice shooting.','Tell himself he is bad at soccer.','Feedback and practice help your brain and body improve.'],
['mindset',3,'Nina\u2019s teacher gave her feedback on a story with some ideas to improve.','Which reaction helps her grow?','\u201CThanks! I\u2019ll use these ideas to make it better.\u201D','\u201CI guess I\u2019m a bad writer.\u201D','Feedback is information that helps you improve. It is not a judgment about you.'],
['mindset',3,'Omar is nervous about learning a new instrument since he is a beginner.','What is a growth-mindset way to think?','\u201CBeginners are supposed to sound like beginners.\u201D','\u201CIf I\u2019m not great right away, I should quit.\u201D','Everyone starts out as a beginner. Skills grow with practice.'],
['mindset',3,'Tess gave up on a tough level in her game three times, then tried a new plan and beat it.','What does this show?','Trying new strategies can help you succeed.','Some levels are only for lucky people.','Changing your strategy is a powerful tool when something is hard.'],
['mindset',4,'Dev says, \u201CI\u2019m terrible at spelling.\u201D','How could he say it with a growth mindset?','\u201CSpelling is hard for me right now, and I can learn it.\u201D','\u201CSpelling is never going to be fun for me.\u201D','Describing what is hard right now (instead of who you are) leaves room to grow.'],
['mindset',4,'A scientist\u2019s experiment did not work the first time.','What would a growth mindset tell her to do?','Figure out what happened and try again.','Decide that science is too hard for her.','Scientists learn from experiments that don\u2019t work. Each try teaches something.'],
['mindset',5,'Lena was praised, \u201CYou\u2019re so smart!\u201D and now feels nervous about trying hard things in case she fails.','What helps Lena?','Focusing on effort and strategies, such as \u201CI worked hard on that!\u201D','Only doing easy things so she always looks smart.','When you value effort and learning, hard things feel more like adventures.'],
['mindset',5,'A coach says, \u201CMistakes are the proof you are trying something new.\u201D','What does the coach mean?','If you never make mistakes, you may not be stretching your brain.','You should make mistakes on purpose all the time.','Trying challenging things means some mistakes will happen, and your brain learns from them.'],
/* ---- memory & sleep ---- */
['memory',1,'Kai wants to remember his spelling words for Friday.','Which plan helps most?','Practice a little each day.','Read the list one time on Thursday night.','Short practice over many days builds stronger memories than one big try.'],
['memory',1,'Mia has a big game tomorrow and wants her brain ready.','What helps her brain and body most tonight?','Go to bed on time and get a good night\u2019s sleep.','Stay up late to practice more.','Sleep helps your brain store what you learned and gives you energy to play.'],
['memory',1,'Eli wants to remember a new word, \u201Cenormous.\u201D','What helps him remember?','Use it in a sentence and say it out loud.','Hope he will remember it by itself.','When you use a word, your brain makes extra connections to it.'],
['memory',2,'Ana wants to remember the order of the planets.','What is a good memory trick?','Make up a silly sentence using the first letter of each planet.','Read the planets once really fast.','Funny sentences and pictures give your brain hooks to hang facts on.'],
['memory',2,'Theo studied his times tables yesterday and today he feels fuzzy on a few.','What is the best move?','Practice them again today. Reviewing helps memories stick.','Decide that his memory is broken.','Forgetting a little is normal. Reviewing again brings the facts back stronger.'],
['memory',2,'Jada tried to learn a long poem all at once.','What would help her memory more?','Learn one part at a time and review often.','Try to learn everything in a single try.','Breaking things into small chunks is easier for your brain to hold.'],
['memory',3,'Max wants to remember what he read in a chapter.','Which is better for memory?','Explain the chapter to someone in his own words.','Read it again and again without stopping.','Explaining something to someone makes your brain work with the ideas, which helps you remember.'],
['memory',3,'Ivy keeps forgetting to bring her library book.','What can help her remember?','Put the book by her backpack the night before.','Just try harder to remember on the day.','A reminder in a place you will see it is easier than relying on your memory alone.'],
['memory',4,'Quinn has a test on Friday and today is Monday.','What is the smartest plan?','Study a little each day, then check what you remember.','Wait until Thursday night and study for hours.','Spacing out practice helps your brain keep things for the long term.'],
['memory',4,'Rosa studies by closing her notes and trying to say what she remembers.','Why is this a good strategy?','Trying to remember makes memories stronger.','It wastes time because the notes have the answers.','Pulling information out of your brain is like exercise for the memory.'],
['memory',5,'Finn learned something new at 4 p.m. and wants to remember it next week.','Which is the best combination?','Review it tonight and again in a few days, then sleep well.','Look at it once and never again.','Review plus sleep helps your brain move new learning into long-term memory.'],
['memory',5,'Hana studies with music with words playing, and notices she keeps losing her place.','What could help?','Study in a quieter place, or use music without words.','Turn the music louder.','Songs with words can compete with reading words in your brain. Quiet helps you focus.'],
/* ---- focus ---- */
['focus',1,'Jay is starting his homework, but his tablet keeps buzzing.','What helps him focus?','Put the tablet in another room while he works.','Check each buzz right away.','Out of sight, out of mind. Fewer distractions help your brain stay on one thing.'],
['focus',1,'Lucy\u2019s mind keeps wandering during reading.','What can she do?','Gently bring her attention back, and maybe point to the words.','Think \u201CI\u2019m bad at this\u201D and stop.','Everyone\u2019s mind wanders. Noticing it and coming back is the skill.'],
['focus',2,'Noah has a big project and feels overwhelmed.','What helps him start?','Break it into small steps and do the first one.','Think about the whole project at once.','Small steps feel doable, and starting makes the next step easier.'],
['focus',2,'Ella has 20 minutes of homework.','Which plan helps her focus best?','Set a timer and do one thing at a time.','Switch between homework, snacks, and games.','Doing one thing at a time uses your brain\u2019s attention best.'],
['focus',2,'Ravi\u2019s desk is covered with toys and papers.','What can help him focus?','Clear off the desk so only homework is there.','Add more toys to the desk for fun.','A tidy space gives your eyes and brain fewer things to compete for attention.'],
['focus',3,'Ada feels restless after sitting for a long time.','What helps her brain refocus?','Take a short stretch or movement break.','Keep sitting and push through for an hour.','Moving your body wakes up your brain and helps you pay attention again.'],
['focus',3,'Sam says he can text and do homework at the same time.','What does science say?','Switching back and forth makes it harder and slower to learn.','Brains are perfect at doing two things at once.','The brain actually switches between tasks, and each switch costs focus time.'],
['focus',4,'Pia wants to read for 15 minutes but keeps checking the clock.','What is a good idea?','Set a timer in a place she cannot see and read until it rings.','Keep watching the clock to be sure.','A timer does the watching for you so your brain can focus on the story.'],
['focus',4,'Owen forgot what the teacher said because he was daydreaming.','What helps next time?','Write one or two key words as the teacher talks.','Try not to ever think about anything else.','Jotting notes gives your brain a job and helps you stay with the lesson.'],
['focus',5,'Cleo has a hard assignment and a fun show on, and keeps getting pulled to the show.','What is a smart move?','Finish the hard work first, then enjoy the show as a reward.','Watch first and hope there is energy later.','Using something fun as a reward after focused work helps build good habits.'],
['focus',5,'Dan wants to be able to pay attention for longer.','Which practice helps over time?','Practice focusing for short times and slowly make them longer.','Force himself to focus for hours on day one.','Like training a muscle, attention grows when you stretch it a little at a time.'],
/* ---- feelings (strategies; no wrong feelings) ---- */
['feelings',1,'Tara feels nervous before reading aloud.','Which tool can help her feel calmer?','Take a few slow, deep breaths.','Tell herself she must not feel nervous.','Slow breathing tells your body it is safe, and nerves settle down. All feelings are okay.'],
['feelings',1,'Ben feels really mad because his tower fell over.','What is a helpful thing to do?','Squeeze a pillow, take deep breaths, and then try again.','Knock over his sister\u2019s tower.','Calming tools help your body settle, and you can still care about others while you feel mad.'],
['feelings',1,'Lily is feeling a big, jumbled feeling and does not know what it is.','What can help?','Name the feeling, like \u201CI feel disappointed.\u201D','Pretend to feel nothing.','Naming a feeling helps your brain calm down. It is called \u201Cname it to tame it.\u201D'],
['feelings',2,'Jon feels sad because his friend is moving away.','What could help?','Talk to someone he trusts about how he feels.','Keep it all inside and never mention it.','Sad feelings are normal. Sharing them helps them feel lighter.'],
['feelings',2,'Maya is excited and cannot sit still before a trip.','What can help her wait?','Draw or plan something fun to use her energy.','Tell herself she has to feel calm right now.','Excitement is a feeling with lots of energy. Giving it a safe job helps.'],
['feelings',2,'Eli feels frustrated by a hard worksheet.','What helps him reset?','Take a quick break, then try one problem at a time.','Rip the paper and give up.','A short reset gives your brain room to think clearly again.'],
['feelings',3,'Nora is worried about a test.','What is a good strategy?','Make a plan to study a little each day, and breathe slowly when worry shows up.','Tell herself worrying means she will fail.','A plan gives worry something useful to do, and breathing helps your body relax.'],
['feelings',3,'Ravi feels embarrassed because he tripped in front of the class.','What can he remember?','Everyone trips sometimes, and the feeling will pass.','He should hide at home for a week.','Embarrassed feelings fade quickly, and most people forget small moments.'],
['feelings',3,'Chloe\u2019s heart is pounding before a performance.','What can she tell herself?','\u201CMy body is getting ready, and I can use that energy.\u201D','\u201CSomething terrible is going to happen.\u201D','A fast heartbeat is a normal sign of energy. Calming breaths and good thoughts help.'],
['feelings',4,'Gabe notices his shoulders tighten and his face gets hot when someone teases him.','What is a smart first step?','Notice the signs, take a breath, and decide how to respond.','Say the first mean thing that comes to mind.','Noticing your body\u2019s signals gives you a moment to choose how to act.'],
['feelings',4,'Poppy feels left out at lunch.','Which strategy is helpful?','Sit by someone kind, say hello, or talk to a trusted adult.','Decide that no one likes her.','Feeling left out is hard, and reaching out or getting help can change the day.'],
['feelings',5,'Isaac says, \u201CI should never feel angry.\u201D','What is true about feelings?','All feelings are okay, and what matters is how we handle them.','Anger is a bad feeling that means something is wrong with you.','Feelings are messages. Choosing safe ways to respond is the skill we can learn.'],
['feelings',5,'Mina feels overwhelmed with homework, a recital, and chores.','What helps most?','Write down the list, pick the first step, and ask for help if needed.','Try to do everything at the very same time.','Writing things down shrinks big worries, and asking for help is a strength.'],
/* ---- empathy ---- */
['empathy',1,'A new kid stands alone at recess.','What is a kind choice?','Invite him to play.','Walk past and not say anything.','Kindness helps people feel they belong.'],
['empathy',1,'Your friend\u2019s balloon popped and she is crying.','How can you show you care?','Say, \u201CThat is sad. Do you want a hug?\u201D','Say, \u201CIt\u2019s just a balloon.\u201D','Listening and caring tell your friend her feelings matter.'],
['empathy',2,'Sam is quiet and keeps frowning at his lunch.','What is a kind question?','\u201CHey, are you okay?\u201D','\u201CWhy are you being weird?\u201D','Gentle questions invite people to share how they feel.'],
['empathy',2,'Your little brother is scared of thunder.','What helps him feel better?','Sit with him and say, \u201CI am here with you.\u201D','Laugh at him for being afraid.','People feel safer when someone stays calm and kind beside them.'],
['empathy',2,'Priya\u2019s drawing did not turn out how she wanted.','What is a kind thing to say?','\u201CI like the colors you used!\u201D','\u201CThat looks bad.\u201D','Noticing something real and positive helps people feel encouraged.'],
['empathy',3,'Two kids are arguing over a toy.','What is perspective-taking?','Thinking about how the other kid is feeling and why.','Deciding who wins by arguing louder.','Perspective-taking means picturing the situation through someone else\u2019s eyes.'],
['empathy',3,'Your friend did not invite you to her party.','What is a helpful first step?','Ask her calmly and think about possible reasons.','Assume she hates you and stop talking.','There are usually many reasons for things. Asking helps you understand.'],
['empathy',3,'A classmate gets a low score and looks down.','What is an empathetic response?','Say, \u201CTests are hard sometimes. I can help you study if you want.\u201D','Tell everyone about his score.','Empathy means caring about how someone feels and offering support.'],
['empathy',4,'Mia\u2019s grandma talks slowly because she is learning English.','What shows respect?','Be patient and give her time to finish.','Finish her sentences and rush her.','Patience shows that you value the person and what she wants to say.'],
['empathy',4,'Jacob says a hurtful joke and his friend goes quiet.','What is a good next step?','Say sorry and ask how to make it right.','Say, \u201CIt was only a joke, get over it.\u201D','A sincere apology repairs trust, even when you did not mean harm.'],
['empathy',5,'You notice a classmate eating alone every day.','What could a thoughtful person do?','Invite them to sit together and learn what they like.','Assume they enjoy being alone and do nothing.','Small invitations can mean a lot, and you can always respect it if they say no.'],
['empathy',5,'Two people see the same ice cream cone on the ground. One laughs and one looks sad.','What does this show?','People can feel different things about the same event.','One of them must be wrong.','Feelings come from each person\u2019s experiences, so empathy means seeking to understand.'],
/* ---- thinking tricks (biases, illusions) ---- */
['bias',1,'Two lines look different in length, but when you measure them, they are the same.','What can we learn?','Our eyes can be tricked, so it is smart to check.','Our eyes are never wrong.','Optical illusions show that the brain makes guesses, so measuring helps.'],
['bias',1,'You think the new kid will be mean because he looks serious.','What is a better idea?','Get to know him before deciding.','Decide right away that you know him.','First impressions can be wrong. Spending time shows what people are really like.'],
['bias',2,'Maya only reads facts that agree with what she already believes.','What would help her learn more?','Also read about other ideas and compare.','Ignore everything that disagrees.','Looking at different ideas helps your thinking stay flexible. It\u2019s called fighting confirmation bias.'],
['bias',2,'Jake saw one friendly dog and thinks all dogs are friendly.','What is a smarter conclusion?','Some dogs are friendly, but I should ask the owner first.','All dogs are always friendly.','One example is not enough to know about a whole group.'],
['bias',2,'A cereal box says \u201CBest cereal ever!\u201D','How can you think carefully?','Remember that ads want you to buy, so check for facts.','Believe it because it is on the box.','Thinking about who wrote a message helps you decide if it is trustworthy.'],
['bias',3,'You hear a rumor about a classmate.','What is a good thinking tool?','Ask, \u201CIs this true? How do we know?\u201D','Pass it on right away.','Checking a source before sharing is a thinking superpower.'],
['bias',3,'Ella thinks her team will win because they won once before.','What is a helpful reminder?','Past wins don\u2019t guarantee the future, so keep practicing.','They will win without trying.','Believing something is guaranteed can make us stop doing what helps.'],
['bias',3,'Dan blames the weather for a bad test score, but he did not study.','What is a growth-minded thought?','\u201CNext time I\u2019ll study more.\u201D','\u201CIt was all bad luck.\u201D','Looking at what you can control helps you improve.'],
['bias',4,'Leo remembers one time his friend was late and now thinks \u201Che is always late.\u201D','What thinking trick is happening?','Using one example to make a rule about someone.','Using lots of data to decide.','Watching for \u201Calways\u201D and \u201Cnever\u201D in our thoughts helps keep us fair.'],
['bias',4,'Nia pays attention to the 3 times her friend forgot and ignores the 20 times she remembered.','What would be fairer?','Count all of the times, not just the ones that stand out.','Only count the mistakes.','Our brains notice surprising events more, so counting everything helps us be fair.'],
['bias',5,'Sara guessed there would be more airplane crashes than car crashes because the news shows them more.','What is a smart question?','\u201CAm I judging by how often I hear about it or by real numbers?\u201D','\u201CIf I hear about it a lot, it must be common.\u201D','Dramatic things stick in the mind, so real numbers give a better picture.'],
['bias',5,'Teams in a game keep arguing over a close call.','Why can both sides feel sure they are right?','Each person pays more attention to what helps their own side.','One side is always lying.','Brains like to protect our side. Naming this helps us be fairer.'],
/* ---- habits & practice ---- */
['habits',1,'Cam wants to get better at piano.','What helps most?','Practice for a few minutes every day.','Practice for one long time on Sunday.','Small, regular practice builds habits and skills.'],
['habits',1,'Zoe often forgets to brush her teeth at night.','What could help her remember?','Put a sticker chart or a reminder by the sink.','Hope she remembers by luck.','Visual reminders help turn a new action into a habit.'],
['habits',2,'Raj wants to read more books.','What is a good habit plan?','Read for 10 minutes after dinner every night.','Read whenever he feels like it.','Doing something at the same time each day makes it easier to keep going.'],
['habits',2,'Fiona tried a new sport and was not very good at first.','What should she remember?','Skills grow with practice, so keep going.','If you are not good right away, it is not for you.','Practice changes your brain and body to get better.'],
['habits',2,'Gus wants to stop biting his nails.','Which helps most?','Notice when he does it and do a different action with his hands.','Just think \u201CI can\u2019t stop.\u201D','Replacing a habit with a new action works better than just saying stop.'],
['habits',3,'Lily wants to practice math facts but keeps getting distracted.','What is a good habit trick?','Link it to something she already does, like practice after snack.','Wait until she feels like it.','Linking a new habit to a daily routine makes it easier to remember.'],
['habits',3,'Ravi missed two days of practice.','What is a helpful next step?','Start again today without being hard on himself.','Give up since the streak is broken.','Habits are built over time, and missing a day is not the end.'],
['habits',3,'Tess wants to get stronger at spelling in a month.','Which plan is best?','Practice 10 minutes a day and track progress.','Cram for three hours the night before the test.','Small steady practice is the most powerful way to learn skills.'],
['habits',4,'Mo checks off each day he practices his guitar.','Why does this help?','Seeing progress feels good and keeps him motivated.','It does nothing because it\u2019s just a mark.','Tracking progress rewards your brain and builds momentum.'],
['habits',4,'Kayla\u2019s coach says, \u201CPractice makes progress.\u201D','Why not \u201Cpractice makes perfect\u201D?','Nobody is perfect, but everyone can keep improving.','Because practice never helps.','Aiming for progress is healthier than aiming for perfection.'],
['habits',5,'Eli wants to build a habit of reading but thinks, \u201CI\u2019ll start when I have more time.\u201D','What is a better approach?','Start with a tiny step like one page a day.','Wait until the perfect time.','Tiny starts are easier to keep, and they grow into bigger habits.'],
['habits',5,'Nina notices she is more successful when she practices right after school.','What does this show?','Finding the best time and place for yourself makes habits easier.','Habits are only about willpower.','Setting up your day to support a habit is smart planning, not cheating.'],
/* ---- kindness & teamwork ---- */
['team',1,'During a group project, one teammate has a different idea.','What helps the team?','Listen and try to combine the ideas.','Say only your idea counts.','Teams work best when each person\u2019s ideas are heard.'],
['team',1,'A teammate drops the ball in a game.','What can you say?','\u201CNice try! You\u2019ll get the next one.\u201D','\u201CYou messed up!\u201D','Encouragement makes the whole team stronger.'],
['team',2,'Your class is cleaning up after art, and one table has a big mess.','What is a team-minded action?','Help clean it even if it was not your mess.','Leave it because it was not yours.','Teams get tasks done faster when people pitch in.'],
['team',2,'Pia and Max both want to be the leader.','What is a fair solution?','Take turns, or share the job.','Argue until one gives up.','Fair plans help everyone feel respected.'],
['team',2,'Someone says a kind thing to you.','What happens in your brain?','You often feel good, and kindness can spread.','Nothing happens at all.','Kind words really do trigger good feelings and encourage more kindness.'],
['team',3,'Your teammate is struggling with a part of the project.','What is the best way to help?','Offer to show her what you know, then let her try.','Do it for her so it is fast.','Helping people learn is kinder than doing everything for them.'],
['team',3,'Your team lost the game.','What shows good sportsmanship?','Congratulate the other team and talk about what you learned.','Blame the referee and stomp off.','Good sports respect others and learn from every game.'],
['team',3,'You have a different opinion from your group.','How can you share it kindly?','\u201CHere\u2019s another idea. What do you think?\u201D','\u201CYour idea will not work. Mine is better.\u201D','Respectful words keep people listening and working together.'],
['team',4,'Someone is being left out of a group chat or game.','What can an upstander do?','Include them or invite them in.','Pretend not to notice.','Small actions can change how someone feels. Being kind is a team skill.'],
['team',4,'Your group has a disagreement about how to do a project.','What helps?','Listen to each other, then vote or compromise.','Everyone does their own thing.','Compromise means each person gives a little, and the team gets stronger.'],
['team',5,'Your friend is having a hard time and asks you to keep a secret, but you worry that she might be unsafe.','What is the best choice?','Tell a trusted adult because safety comes first.','Keep it secret no matter what.','Some secrets are too big to carry alone. Telling a trusted adult is caring.'],
['team',5,'A teammate does something nice for you.','How can you pay it forward?','Do a kind thing for someone else.','Expect another reward for yourself.','Kindness grows when people pass it along.']
];

 (history||[]).forEach(function(r){if(!(r.qz&&unpack))return;var qs=null;try{qs=unpack(r);}catch(e){qs=null;}
  (qs||[]).forEach(function(q){if(q.userAnswer===undefined||!need[q.kind])return;var L=need[q.kind],i=Math.max(1,Math.min(12,q.level|0))-1;

/* growth summary for kid-facing, strength-based messages. history: daily results; unpack gives questions. Compares the last 14 days with before. */
function growth(history,unpack,today){

function pinShell(name,title,sub,pad,extra){
 return [h('h1',null,title),h('div',{class:'card pop'},h('h2',{style:'text-align:center'},sub),h('div',{class:'msg',id:'pinmsg',style:'display:none'}),pad,extra,
  btn('\u2B05 Pick a different kid','gray',function(){renderPicker();},'pinback'))];}
function pinMsg(t){var m=document.getElementById('pinmsg');if(!m)return;m.textContent=t;m.style.display=t?'block':'none';}
function renderSetPin(name,first,msg){
 var stage=first?2:1;
 var pad=keypad(function(pin,reset){
  if(stage===1){renderSetPin(name,pin);return;}
  if(pin!==first){renderSetPin(name,null,'Those didn\u2019t match. Let\u2019s try again!');return;}
  pinMsg('Saving\u2026');
  api({action:'create_pin',kid:name,pin:pin}).then(function(r){
   if(r.s===200&&r.j.token){enterSession(name,r.j.token);return;}
   if(r.s===409){renderPin(name,'That profile already has a PIN. Type it to log in.');return;}
   pinMsg(r.net?'We can\u2019t reach the internet. Try again in a moment.':'Something went wrong. Please try again.');reset();});});
 show(pinShell(name,'Hi '+name+'! \uD83D\uDC4B',stage===1?'Make a secret 4-digit PIN':'Type your PIN again to check it',pad,
  h('p',{class:'small',style:'text-align:center'},'Remember it! You\u2019ll type it each time you play.')));
 if(msg)pinMsg(msg);}
function renderPin(name,msg){
 var pad=keypad(function(pin,reset){
  pinMsg('Checking\u2026');
  api({action:'login',kid:name,pin:pin}).then(function(r){
   if(r.s===200&&r.j.token){enterSession(name,r.j.token);return;}
   if(r.s===404){renderSetPin(name);return;}
   if(r.s===401){pinMsg('Oops, that\u2019s not it. '+r.j.attemptsLeft+(r.j.attemptsLeft===1?' try':' tries')+' left.');reset();return;}
   if(r.s===429){pinMsg('Too many tries. Take a break and try again in '+Math.max(1,Math.ceil((r.j.retryAfter||300)/60))+' minutes.');reset();return;}
   pinMsg(r.net?'We can\u2019t reach the internet. Try again in a moment.':'Something went wrong. Please try again.');reset();});});
 if(kid!==name){kid=name;}
 show(pinShell(name,'Hi '+name+'! \uD83D\uDC4B','Type your PIN',pad,null));
 if(msg)pinMsg(msg);}
function logout(){
 var go=function(){try{sessionStorage.removeItem(SS);}catch(e){}clearTimeout(flushTimer);clearTimeout(retryTimer);renderPicker();};
 if(token&&pending.length){var done=false,fin=function(){if(!done){done=true;go();}};flush().then(fin);setTimeout(fin,3000);}else go();}
function enterSession(name,tok){
 kid=name;token=tok;lostRace=false;try{sessionStorage.setItem(SS,JSON.stringify({kid:name,token:tok}));}catch(e){}
 cacheLoad();setSync('saving');
 show([h('h1',null,'\uD83E\uDDE0 Daily Brain Quiz'),h('div',{class:'card pop'},h('h2',{style:'text-align:center'},'Loading '+name+'\u2019s progress\u2026'))]);
 flush().then(function(){return resync(false);});}
/* pull the saved state from the server (source of truth) */
function resync(rerender){
 if(!token)return Promise.resolve();
 return api({action:'load',token:token}).then(function(r){
  if(r.s===401){token=null;try{sessionStorage.removeItem(SS);}catch(e){}renderPin(kid,'Please type your PIN again.');return;}
  if(r.s===200){
   profile=(r.j.profile&&typeof r.j.profile.age==='number'&&typeof r.j.profile.grade==='number')?{age:r.j.profile.age,grade:r.j.profile.grade}:null;
   if(!pending.length){var s=adopt(normalize(r.j.state));store=s||blank();save();setSync('saved');}
   else if(profile)store.estGrade=profile.grade;
   if(!profile){renderBirth();return;} /* required once: asked at the next sign-in until it is saved */
   afterLoad();return;}
  /* offline or server trouble: use the cached copy */
  if(profile)store.estGrade=profile.grade;
  setSync('offline');retryTimer=setTimeout(flush,15000);render();});}
function afterLoad(){
 if(!store.history.length&&legacyData()&&lsGet('kyleMathQuiz.skip.'+kid)!=='1'){renderImportPrompt();return;}
 render();}
/* ---------- birth month + year (asked once; stays on the server; used only to pick the right questions) ---------- */
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function renderBirth(msg){
 Q=null;var ty=parseInt(today().slice(0,4),10);
 var mo=h('select',{id:'bmonth','aria-label':'Birth month'},h('option',{value:''},'Month\u2026'),MONTHS.map(function(m,i){return h('option',{value:String(i+1)},m);}));
 var yr=h('select',{id:'byear','aria-label':'Birth year'},h('option',{value:''},'Year\u2026'),[0,1,2,3,4,5,6,7].map(function(i){return h('option',{value:String(ty-7-i)},String(ty-7-i));}));
 show([h('h1',null,'\uD83C\uDF82 One quick thing!'),
  h('div',{class:'card pop birth'},h('h2',{style:'text-align:center'},'Hi '+kid+'! When is your birthday month?'),
   h('p',null,'Tell us your birth month and year, so we can pick the right questions for you. (Just the month and year \u2013 no day. A grown-up can help.)'),
   msg?h('div',{class:'msg',id:'birthmsg'},msg):null,
   mo,yr,
   btn('Save and start \u25B6','go',function(){
    var m=parseInt(mo.value,10),y=parseInt(yr.value,10);
    if(!m||!y){renderBirthKeep(mo,yr,'Please pick both your month and your year.');return;}
    var b=document.getElementById('bsave');if(b){b.textContent='Saving\u2026';b.disabled=true;}
    api({action:'set_profile',token:token,month:m,year:y}).then(function(r){
     if(r.s===200&&r.j.profile){profile={age:r.j.profile.age,grade:r.j.profile.grade};store.estGrade=profile.grade;save();afterLoad();return;}
     if(r.s===409){resync(false);return;}
     if(r.s===401){token=null;try{sessionStorage.removeItem(SS);}catch(e){}renderPin(kid,'Please type your PIN again.');return;}
     if(r.s===400&&r.j&&r.j.error==='bad_age'){renderBirth('Hmm, that month and year doesn\u2019t look right. Please check them, or ask a grown-up to help.');return;}
     renderBirth(r.net?'We can\u2019t reach the internet right now. Try again in a moment.':'Something went wrong. Please try again.');});},'bsave'),
   h('p',{class:'small',style:'text-align:center'},'Only you and your grown-ups can see this. It is never shown to anyone else.')),
  logoutBtn()]);}
function renderBirthKeep(mo,yr,msg){var m=document.getElementById('birthmsg');if(!m){m=h('div',{class:'msg',id:'birthmsg'});var c=document.querySelector('.birth');c.insertBefore(m,document.getElementById('bmonth'));}m.textContent=msg;}
/* ---------- one-time import of the old anonymous browser data ---------- */
function legacyData(){try{var o=normalize(JSON.parse(lsGet(LEGACY)||'null'));return o&&o.history.length?o:null;}catch(e){return null;}}
function renderImportPrompt(msg){
 var lg=legacyData();if(!lg){render();return;}
 var last=lg.history[lg.history.length-1];
 show([h('h1',null,'\uD83D\uDCE6 Saved progress found'),
  h('div',{class:'card pop'},h('h2',null,'Is this '+kid+'\u2019s saved progress?'),
   h('p',null,'We found '+lg.history.length+' saved '+(lg.history.length===1?'quiz':'quizzes')+' on this device (last one: '+prettyDate(last.date)+', '+pct(last)+'%, now at '+lvName(lg.level)+').'),
   msg?h('div',{class:'msg',id:'importmsg'},msg):null,
   btn('Yes, bring it in','go',function(){doImport(lg);},'importyes'),
   btn('No, start fresh','gray',function(){lsSet('kyleMathQuiz.skip.'+kid,'1');render();},'importno'))]);}
function doImport(lg){
 var results=[];
 lg.history.forEach(function(r){var qs=questionsOf(r);if(qs&&qs.length&&qs.length<=10)results.push({date:r.date,questions:qs.map(function(q){return {kind:q.kind,level:q.level,text:q.text,truth:q.truth,answer:q.userAnswer};})});});
 var recs=lg.history.map(function(r){var c={};for(var k in r)c[k]=r[k];return c;});
 var b=document.getElementById('importyes');if(b)b.textContent='Bringing it in\u2026';
 api({action:'save',token:token,importHistory:recs,importResults:results,level:lg.level}).then(function(r){
  if(r.s===200){lsDel(LEGACY);api({action:'load',token:token}).then(function(x){if(x.s===200){store=adopt(normalize(x.j.state))||blank();save();}render();});return;}
  if(r.s===409){lsSet('kyleMathQuiz.skip.'+kid,'1');render();return;}
  renderImportPrompt(r.net?'We can\u2019t reach the internet. Try again in a moment.':'Sorry, we couldn\u2019t bring that in. You can start fresh and your old data stays on this device.');});}
/* ---------- home ---------- */
function render(){
 if(!kid){renderPicker();return;}
 Q=null;var rec=recFor(today());
 if(rec){renderResults(rec,'daily');return;}
 var ip=store.inProgress;
 if(ip&&ip.date===today()&&ip.answers&&ip.answers.length>0){
  show([h('h1',null,'Daily Brain Quiz'),h('div',{class:'card pop'},h('h2',null,'Welcome back, '+kid+'! \uD83D\uDC4B'),h('p',null,'You\u2019re on question '+(ip.answers.length+1)+' of '+TOTAL+'.'),
   btn('Keep going \u25B6','go',resumeDaily,'resume'),histBtn()),logoutBtn(),parentCorner()]);return;}
 var first=isFirst(),f=focusSkills(2),ds=dayStreak();
 show([h('h1',null,'\uD83E\uDDE0 Daily Brain Quiz'),h('div',{class:'sub',id:'whoami'},'Hi '+kid+'! \uD83D\uDC4B'),
  h('div',{class:'card pop'},
   h('div',{class:'row'},h('span',{class:'badge'},first?'Level 1 to start':lvName(store.level)),ds?h('span',{class:'badge'},'\uD83D\uDD25 '+ds+' day streak'):null),
   h('h2',null,first?'Hi, super learner! \uD83D\uDC4B':'Ready for today\u2019s 10?'),
   h('p',null,first?'Each question gives you a number for a letter. Is the equation true or false when you use that number? We start easy and the questions get harder as you do well!':'10 new questions are waiting: mostly math, plus English and a fun \u201Chow my brain works\u201D question. They start a little easier and get harder as you get them right.'),
   (!first&&f.length)?h('p',{class:'small'},'\uD83C\uDFAF Extra practice today on: '+f.join(', ')):null,
   h('div',{class:'tip'},'Example: If M = 49, is M \u00F7 7 = 7 true? Plug it in: 49 \u00F7 7 = 7. Yes, TRUE!'),
   btn('Start today\u2019s quiz \u25B6','go',renderReminder,'start'),btn('\uD83D\uDCAA Practice a topic','alt',renderPracticeHome,'practicebtn'),store.history.length?histBtn():null),
  logoutBtn(),parentCorner()]);}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&kid&&!Q&&token){flush().then(function(){if(!pending.length&&!Q)resync(false);});}});
/* ---------- boot: resume this tab's session, otherwise ask who is playing ---------- */
(function boot(){
 var s=null;try{s=JSON.parse(sessionStorage.getItem(SS)||'null');}catch(e){}
 if(s&&KIDS.indexOf(s.kid)>=0&&typeof s.token==='string'){enterSession(s.kid,s.token);return;}
 renderPicker();})();
window.__quiz={profile:function(){return profile;},store:function(){return store;},kid:function(){return kid;},render:render,history:renderHistory,past:renderPast,practice:renderPracticeHome,q:function(){return Q&&Q.qs[Q.idx];},Q:function(){return Q;},pending:function(){return pending;}};
})();
</script>

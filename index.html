 if(n.a.t==='n'&&n.b.t==='n')out.push({node:n,depth:depth});

 while(n.t==='o'&&guard++<20){var c=[];collect(n,0,c);var best=null;
  for(var i=0;i<c.length;i++){var x=c[i];if(!best||x.depth>best.depth||(x.depth===best.depth&&PREC[x.node.op]>PREC[best.node.op]))best=x;}

   if(varLeft){nw=target+c;txt='Undo "'+MINUS+' '+c+'" with its opposite, "+ '+c+'":  '+target+' + '+c+' = '+nw;}
   else{nw=c-target;txt=c+' '+MINUS+' ? = '+target+'. What did we take away from '+c+'? '+c+' '+MINUS+' '+target+' = '+nw;}}

   else{if(w)res=c*val;else{if(val===0||c%val!==0)return null;res=c/val;}}}

 else e=d;

function persist(){if(Q.mode!=='daily')return;

  qs:fixedQs?fixedQs.map(function(q){return q;}):[],answers:[],idx:0,streak:0,best:0,nonce:String(Date.now()),miss:missedFocus()};

/* ---------- my history ---------- */
function avgPct(){var hh=store.history;if(!hh.length)return 0;var t=0;hh.forEach(function(r){t+=pct(r);});return Math.round(t/hh.length);}
function last7Avg(){var hh=store.history.slice(-7);if(!hh.length)return 0;var t=0;hh.forEach(function(r){t+=pct(r);});return Math.round(t/hh.length);}
function histBtn(){return btn('\uD83D\uDCC8 My History','blue',renderHistory,'histbtn');}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function prettyDate(d){var x=new Date(d+'T12:00:00');if(isNaN(x.getTime()))return d;return DOW[x.getDay()]+', '+MON[x.getMonth()]+' '+x.getDate()+', '+x.getFullYear();}

function pctText(p){return p>=50&&p<70?'#d9822b':pctColor(p);}
function svgEl(tag,attrs,text){var e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e;}
/* bars = each quiz %, line = running average % of every quiz up to that day */

function trendChart(recs,runs){
 var W=340,H=180,top=22,bot=30,ch=H-top-bot,n=recs.length,slot=W/Math.max(n,7),bw=Math.min(36,slot*0.66),few=n<=8;
 var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'chart',role:'img','aria-label':'Chart of your last '+n+' quiz scores in percent, with your running average'});

  if(few)svg.appendChild(svgEl('text',{x:x+bw/2,y:y-5,'text-anchor':'middle','font-size':13,fill:'#2d2a4a'},p+'%'));
  if(few||i%2===(n-1)%2)svg.appendChild(svgEl('text',{x:x+bw/2,y:H-10,'text-anchor':'middle','font-size':11,fill:'#636e72'},shortDate(r.date)));
  pts.push((x+bw/2)+','+(top+ch-ch*runs[i]/100));});

function trendMsg(){var hs=store.history,n=hs.length;if(n<2)return 'Play a few more days to see your trend!';

      h('div',{class:'stat'},h('b',null,last7Avg()+'%'),h('span',null,'last 7 average')),
      h('div',{class:'stat'},h('b',null,best+'%'),h('span',null,'best')),
      h('div',{class:'stat'},h('b',null,String(n)),h('span',null,n===1?'quiz':'quizzes'))),
     h('h3',null,'Your last '+k+' '+(k===1?'quiz':'quizzes')),
     trendChart(all.slice(-k),runs.slice(-k)),
     h('p',{class:'small legend'},'Bars = each quiz score. Black line = your running average.'),
     h('div',{class:'msg'},trendMsg())]
    :h('p',null,'No quizzes yet. Finish your first daily quiz and it will show up here!')),
  weakCard(),
  h('div',{class:'card'},h('h2',null,'\uD83D\uDCCB All my quizzes'),n?h('p',{class:'small'},'Tap a quiz to look at every question again.'):null,
   hs.map(function(r){var p=pct(r);
    return h('button',{class:'hrow',type:'button',onclick:function(){renderPast(r.date);}},
     h('div',{class:'l1'},h('span',null,prettyDate(r.date)),h('span',{class:'pct',style:'color:'+pctText(p)},p+'%')),
     h('div',{class:'progress'},h('i',{style:'width:'+p+'%;background:'+pctColor(p)})),
     h('div',{class:'l2'},h('span',null,r.score+'/'+r.total+' right'),h('span',null,'Level '+r.startLevel)));}),
   btn('\u2B05 Back','gray',render,'histback'))];
 show(nodes);}
function renderPast(date){
 var r=recFor(date);if(!r){renderHistory();return;}var p=pct(r),qs=questionsOf(r);
 var rec={questions:qs};
 show([h('h1',null,'Quiz review'),
  h('div',{class:'card pop'},h('p',{style:'text-align:center;font-weight:800;margin:0'},prettyDate(r.date)),
   h('div',{class:'big'},r.score+' / '+r.total),h('div',{style:'text-align:center;font-size:30px;font-weight:900;color:'+pctText(p)},p+'%'),
   h('p',{style:'text-align:center'},lvName(r.startLevel)+(r.best?'  \u2022  \uD83D\uDD25 Best streak: '+r.best:'')),
   Object.keys(r.missed||{}).length?h('p',{class:'small',style:'text-align:center'},'Practice more: '+Object.keys(r.missed).map(function(k){return G.KIND_LABELS[k]||k;}).join(', ')+'.'):null),
  h('div',{class:'card'},h('h2',null,'\uD83D\uDCCB The questions'),
   qs?[h('p',{class:'small'},'Tap a question to see how it works. Orange ones are the ones to learn from!'),reviewList(rec)]
      :h('p',null,'The question details for this day weren\u2019t saved, but the score is: '+r.score+' out of '+r.total+' ('+p+'%).'),
   btn('\u2B05 Back to My History','blue',renderHistory,'pastback'),btn('\uD83C\uDFE0 Home','gray',render))]);}
/* ---------- profiles, PIN, login ---------- */
function keypad(onDone){
 var val='',busy=false;
 var dots=h('div',{class:'dots',id:'dots'},[0,1,2,3].map(function(){return h('i',null);}));
 function paint(){for(var i=0;i<4;i++)dots.children[i].className=i<val.length?'on':'';}
 function reset(){val='';busy=false;paint();}
 function press(c){if(busy||val.length>=4)return;val+=c;paint();if(val.length===4){busy=true;onDone(val,reset);}}
 function back(){if(busy)return;val=val.slice(0,-1);paint();}
 var keys=['1','2','3','4','5','6','7','8','9','','0','\u232B'].map(function(c){
  if(c==='')return h('span');
  return h('button',{type:'button',class:'key',id:c==='\u232B'?'kback':'k'+c,'aria-label':c==='\u232B'?'delete':c,onclick:function(){if(c==='\u232B')back();else press(c);}},c);});
 nextKH=function(e){if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')back();};
 return h('div',null,dots,h('div',{class:'pad'},keys));}
function renderPicker(msg){
 Q=null;kid=null;token=null;pending=[];store=blank();setSync('');
 show([h('h1',null,'\uD83E\uDDE0 Daily Math Quiz'),h('div',{class:'sub'},'True or False? Is the mystery number right?'),
  h('div',{class:'card pop'},h('h2',{style:'text-align:center'},'Who\u2019s playing today?'),
   msg?h('div',{class:'msg',id:'pickmsg'},msg):null,
   KIDS.map(function(n,i){return h('button',{type:'button',class:'btn kid '+(i?'k2':'k1'),id:'pick-'+n,onclick:function(){pickKid(n);}},(i?'\uD83D\uDE80 ':'\uD83E\uDD84 ')+n);}))]);}
function pickKid(name){
 var b=document.getElementById('pick-'+name);if(b)b.textContent='One moment\u2026';
 api({action:'status'}).then(function(r){
  if(r.net||r.s!==200){renderPicker('We can\u2019t reach the internet right now. Check your connection and try again.');return;}
  if(r.j.kids&&r.j.kids[name])renderPin(name);else renderSetPin(name);});}
function pinShell(name,title,sub,pad,extra){
 return [h('h1',null,title),h('div',{class:'card pop'},h('h2',{style:'text-align:center'},sub),h('div',{class:'msg',id:'pinmsg',style:'display:none'}),pad,extra,
  btn('\u2B05 Pick a different kid','gray',function(){renderPicker();},'pinback'))];}
function pinMsg(t){var m=document.getElementById('pinmsg');if(!m)return;m.textContent=t;m.style.display=t?'block':'none';}
function renderSetPin(name,first,msg){
 var stage=first?2:1;
 var pad=keypad(function(pin,reset){
  if(stage===1){renderSetPin(name,pin);return;}
  if(pin!==first){renderSetPin(name,null,'Those didn\u2019t match. Let\u2019s try again!');return;}
  pinMsg('Saving\u2026');
  api({action:'create_pin',kid:name,pin:pin}).then(function(r){
   if(r.s===200&&r.j.token){enterSession(name,r.j.token);return;}
   if(r.s===409){renderPin(name,'That profile already has a PIN. Type it to log in.');return;}
   pinMsg(r.net?'We can\u2019t reach the internet. Try again in a moment.':'Something went wrong. Please try again.');reset();});});
 show(pinShell(name,'Hi '+name+'! \uD83D\uDC4B',stage===1?'Make a secret 4-digit PIN':'Type your PIN again to check it',pad,
  h('p',{class:'small',style:'text-align:center'},'Remember it! You\u2019ll type it each time you play.')));
 if(msg)pinMsg(msg);}
function renderPin(name,msg){
 var pad=keypad(function(pin,reset){
  pinMsg('Checking\u2026');
  api({action:'login',kid:name,pin:pin}).then(function(r){
   if(r.s===200&&r.j.token){enterSession(name,r.j.token);return;}
   if(r.s===404){renderSetPin(name);return;}
   if(r.s===401){pinMsg('Oops, that\u2019s not it. '+r.j.attemptsLeft+(r.j.attemptsLeft===1?' try':' tries')+' left.');reset();return;}
   if(r.s===429){pinMsg('Too many tries. Take a break and try again in '+Math.max(1,Math.ceil((r.j.retryAfter||300)/60))+' minutes.');reset();return;}
   pinMsg(r.net?'We can\u2019t reach the internet. Try again in a moment.':'Something went wrong. Please try again.');reset();});});
 if(kid!==name){kid=name;}
 show(pinShell(name,'Hi '+name+'! \uD83D\uDC4B','Type your PIN',pad,null));
 if(msg)pinMsg(msg);}
function logout(){
 var go=function(){try{sessionStorage.removeItem(SS);}catch(e){}clearTimeout(flushTimer);clearTimeout(retryTimer);renderPicker();};
 if(token&&pending.length){var done=false,fin=function(){if(!done){done=true;go();}};flush().then(fin);setTimeout(fin,3000);}else go();}
function enterSession(name,tok){
 kid=name;token=tok;lostRace=false;try{sessionStorage.setItem(SS,JSON.stringify({kid:name,token:tok}));}catch(e){}
 cacheLoad();setSync('saving');
 show([h('h1',null,'\uD83E\uDDE0 Daily Math Quiz'),h('div',{class:'card pop'},h('h2',{style:'text-align:center'},'Loading '+name+'\u2019s progress\u2026'))]);
 flush().then(function(){return resync(false);});}
/* pull the saved state from the server (source of truth) */
function resync(rerender){
 if(!token)return Promise.resolve();
 return api({action:'load',token:token}).then(function(r){
  if(r.s===401){token=null;try{sessionStorage.removeItem(SS);}catch(e){}renderPin(kid,'Please type your PIN again.');return;}
  if(r.s===200){
   if(!pending.length){var s=normalize(r.j.state);store=s||blank();save();setSync('saved');}
   if(!store.history.length&&legacyData()&&lsGet('kyleMathQuiz.skip.'+kid)!=='1'){renderImportPrompt();return;}
   render();return;}
  /* offline or server trouble: use the cached copy */
  setSync('offline');retryTimer=setTimeout(flush,15000);render();});}
/* ---------- one-time import of the old anonymous browser data ---------- */
function legacyData(){try{var o=normalize(JSON.parse(lsGet(LEGACY)||'null'));return o&&o.history.length?o:null;}catch(e){return null;}}
function renderImportPrompt(msg){
 var lg=legacyData();if(!lg){render();return;}
 var last=lg.history[lg.history.length-1];
 show([h('h1',null,'\uD83D\uDCE6 Saved progress found'),
  h('div',{class:'card pop'},h('h2',null,'Is this '+kid+'\u2019s saved progress?'),
   h('p',null,'We found '+lg.history.length+' saved '+(lg.history.length===1?'quiz':'quizzes')+' on this device (last one: '+prettyDate(last.date)+', '+pct(last)+'%, now at '+lvName(lg.level)+').'),
   msg?h('div',{class:'msg',id:'importmsg'},msg):null,
   btn('Yes, bring it in','go',function(){doImport(lg);},'importyes'),
   btn('No, start fresh','gray',function(){lsSet('kyleMathQuiz.skip.'+kid,'1');render();},'importno'))]);}
function doImport(lg){
 var results=[];
 lg.history.forEach(function(r){var qs=questionsOf(r);if(qs&&qs.length&&qs.length<=10)results.push({date:r.date,questions:qs.map(function(q){return {kind:q.kind,level:q.level,text:q.text,truth:q.truth,answer:q.userAnswer};})});});
 var recs=lg.history.map(function(r){var c={};for(var k in r)c[k]=r[k];return c;});
 var b=document.getElementById('importyes');if(b)b.textContent='Bringing it in\u2026';
 api({action:'save',token:token,importHistory:recs,importResults:results,level:lg.level}).then(function(r){
  if(r.s===200){lsDel(LEGACY);api({action:'load',token:token}).then(function(x){if(x.s===200){store=normalize(x.j.state)||blank();save();}render();});return;}
  if(r.s===409){lsSet('kyleMathQuiz.skip.'+kid,'1');render();return;}
  renderImportPrompt(r.net?'We can\u2019t reach the internet. Try again in a moment.':'Sorry, we couldn\u2019t bring that in. You can start fresh and your old data stays on this device.');});}
/* ---------- home ---------- */
function render(){
 if(!kid){renderPicker();return;}
 Q=null;var rec=recFor(today());
 if(rec){renderResults(rec,'daily');return;}
 var ip=store.inProgress;
 if(ip&&ip.date===today()&&ip.answers&&ip.answers.length>0){
  show([h('h1',null,'Daily Math Quiz'),h('div',{class:'card pop'},h('h2',null,'Welcome back, '+kid+'! \uD83D\uDC4B'),h('p',null,'You\u2019re on question '+(ip.answers.length+1)+' of '+TOTAL+'.'),
   btn('Keep going \u25B6','go',resumeDaily,'resume'),histBtn()),logoutBtn(),parentCorner()]);return;}
 var first=isFirst(),f=focusText(missedFocus()),ds=dayStreak();
 show([h('h1',null,'\uD83E\uDDE0 Daily Math Quiz'),h('div',{class:'sub',id:'whoami'},'Hi '+kid+'! \uD83D\uDC4B'),
  h('div',{class:'card pop'},
   h('div',{class:'row'},h('span',{class:'badge'},first?'Level 1 to start':lvName(store.level)),ds?h('span',{class:'badge'},'\uD83D\uDD25 '+ds+' day streak'):null),
   h('h2',null,first?'Hi, math star! \uD83D\uDC4B':'Ready for today\u2019s 10?'),
   h('p',null,first?'Each question gives you a number for a letter. Is the equation true or false when you use that number? We start easy and the questions get harder as you do well!':'10 new questions are waiting. They start a little easier and get harder as you get them right.'),
   (!first&&f.length)?h('p',{class:'small'},'\uD83C\uDFAF Extra practice today on: '+f.join(', ')):null,
   h('div',{class:'tip'},'Example: If M = 49, is M \u00F7 7 = 7 true? Plug it in: 49 \u00F7 7 = 7. Yes, TRUE!'),
   btn('Start today\u2019s quiz \u25B6','go',renderReminder,'start'),store.history.length?histBtn():null),
  logoutBtn(),parentCorner()]);}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&kid&&!Q&&token){flush().then(function(){if(!pending.length&&!Q)resync(false);});}});
/* ---------- boot: resume this tab's session, otherwise ask who is playing ---------- */
(function boot(){
 var s=null;try{s=JSON.parse(sessionStorage.getItem(SS)||'null');}catch(e){}
 if(s&&KIDS.indexOf(s.kid)>=0&&typeof s.token==='string'){enterSession(s.kid,s.token);return;}
 renderPicker();})();
window.__quiz={store:function(){return store;},kid:function(){return kid;},render:render,history:renderHistory,past:renderPast};
})();
</script>

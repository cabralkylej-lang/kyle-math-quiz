<script id="gen">

/* ---------- random ---------- */

 if(n.a.t==='n'&&n.b.t==='n')out.push({node:n,depth:depth});
 collect(n.b,depth+(needs(n.b,n,true)?1:0),out);}

 while(n.t==='o'&&guard++<20){var c=[];collect(n,0,c);var best=null;
  for(var i=0;i<c.length;i++){var x=c[i];if(!best||x.depth>best.depth||(x.depth===best.depth&&PREC[x.node.op]>PREC[best.node.op]))best=x;}
  var nd=best.node;var before=show(nd,'?');var val=evalN(nd,0);

  if(other.t==='o')pre.push('First work out the number part: '+show(other,name)+' = '+c+'.');

   if(varLeft){nw=target+c;txt='Undo "'+MINUS+' '+c+'" with its opposite, "+ '+c+'":  '+target+' + '+c+' = '+nw;}
   else{nw=c-target;txt=c+' '+MINUS+' ? = '+target+'. What did we take away from '+c+'? '+c+' '+MINUS+' '+target+' = '+nw;}}

   else{if(w)res=c*val;else{if(val===0||c%val!==0)return null;res=c/val;}}}

 else e=d;

 return {lines:L,answer:e/k};}

function poolFor(level,miss){var out=[],kinds={},i,e;

   for(var l=level-1;l>=1;l--){var q=POOLS[l],found=null;for(i=0;i<q.length;i++)if(q[i][0]===k)found=q[i];

   solve=[];if(cs.t==='o')solve.push('First work out the number side: '+show(cs,vn)+' = '+T+'.');
   for(var i=0;i<un.pre.length;i++)solve.push(un.pre[i]);
   solve=solve.concat(un.lines);}
  else{if(!eq.custom||eq.custom.answer!==s)continue;solve=eq.custom.lines;}

   if(chain){for(i2=0;i2<chain.length;i2++){var w=chainRun(chain,evalN(oneSided&&hasV(L)?R:L,0),i2);
     if(w!==null){cand.push(w);cand.push(w);}}}
   cand.push(s+1,s-1,s+1,s-1,s+2,s-2);
   (function leaves(n){if(n.t==='n')cand.push(n.v);else if(n.t==='o'){leaves(n.a);leaves(n.b);}})(L);
   (function leaves(n){if(n.t==='n')cand.push(n.v);else if(n.t==='o'){leaves(n.a);leaves(n.b);}})(R);
   var ok=[];for(i2=0;i2<cand.length;i2++){var x=cand[i2];

   if(!ok.length){for(var d=1;d<=80&&!ok.length;d++){var xs2=[s+d,s-d];
     for(var j=0;j<2;j++){var xv=xs2[j];if(xv>=1){var a2=evalN(L,xv),b2=evalN(R,xv);if(a2!==null&&b2!==null&&a2!==b2)ok.push(xv);}}}}

  var plug=plugLines(L,R,vn,p);

  var tip;
  if(chain){var seen={},bits=[];for(var m=0;m<chain.length;m++){var op=chain[m].op;if(seen[op])continue;seen[op]=1;
    var opp=op==='+'?MINUS:op===MINUS?'+':op===TIMES?DIV:TIMES;bits.push('"'+op+'" is undone by "'+opp+'"');}
   tip='Opposite-operation tip: + and '+MINUS+' undo each other, and '+TIMES+' and '+DIV+' undo each other. Here, '+bits.join(', ')+'. Undo the steps backwards, last step first!';}
  else tip='Opposite-operation tip: + and '+MINUS+' undo each other, and '+TIMES+' and '+DIV+' undo each other. When the mystery number is on both sides, do the same thing to BOTH sides to keep it balanced, like a seesaw!';
  var shortExpl=truth?('Yes! With '+vn+' = '+p+', both sides equal '+lv+'.'):('Right! With '+vn+' = '+p+' the sides are '+lv+' and '+rv+', which don\u2019t match. '+vn+' should be '+s+'.');
  return {level:level,kind:ent.kind,label:KIND_LABELS[ent.kind],vn:vn,p:p,s:s,truth:truth,eq:eqText,text:text,
   plug:plug.lines,undo:undo,tip:tip,shortExpl:shortExpl,lv:lv,rv:rv};}

/* ---------- schedule & adaptive rules ---------- */
function schedule(seed){var r=rngFromSeed('sched|'+seed);return shuffle(r,[true,true,true,true,true,false,false,false,false,false]);}
function nextQuestionLevel(base,first,results){

  if(results[i]){streak++;if(streak>=need){cur=Math.min(hi,cur+1);streak=0;}}
  else{streak=0;cur=Math.max(lo,cur-1);}
  if(!first&&i===1){var c=(results[0]?1:0)+(results[1]?1:0);if(c>=1&&cur<base)cur=base;streak=0;}}

function nextDayLevel(base,score,first,endLevel){

})();

 if(rec.change==='bottom')return '\uD83C\uDF31 Tomorrow we\u2019ll practice Level 1 again so it feels super easy. You\u2019re doing great!';

function scoreMsg(s){return s===10?'PERFECT! \uD83E\uDD29':s>=9?'Amazing! \uD83C\uDF1F':s>=7?'Great job! \uD83D\uDE0A':s>=5?'Nice work! Keep going! \uD83D\uDCAA':'Good effort! Every try makes you stronger! \uD83C\uDF31';}
function reviewList(rec){return (rec.questions||[]).map(function(q,i){var ok=q.userAnswer===q.truth;
 var d=h('details',{class:'rev '+(ok?'ok':'no')},h('summary',null,(ok?'\u2705 ':'\uD83D\uDFE0 ')+(i+1)+'. If '+q.vn+' = '+q.p+':  '+q.eq+'  \u2192 '+(q.truth?'True':'False')),
  h('div',{class:'inner'},h('p',null,'You said '+(q.userAnswer?'True':'False')+'. '+q.shortExpl),
   ok?null:[h('h3',null,'Plug it in'),stepsList(q.plug),h('h3',null,'What should '+q.vn+' be?'),stepsList(q.undo),h('div',{class:'tip'},'\uD83D\uDCA1 '+q.tip)]));return d;});}
function renderResults(rec,mode){
 var stars=rec.score>=9?'\u2B50\u2B50\u2B50':rec.score>=7?'\u2B50\u2B50':rec.score>=5?'\u2B50':'\uD83C\uDF31';
 var nodes=[h('h1',null,mode==='daily'?'Quiz complete!':mode==='practice'?'Practice done!':'Retry done!'),
  h('div',{class:'card pop'},h('div',{class:'big'},rec.score+' / '+rec.total),h('div',{class:'stars'},stars),h('h2',{style:'text-align:center'},scoreMsg(rec.score)),
   rec.best?h('p',{style:'text-align:center'},'\uD83D\uDD25 Best streak: '+rec.best):null,
   mode==='daily'?h('div',{class:'msg',id:'levelmsg'},levelMsg(rec)):h('div',{class:'msg'},'This was just for fun \u2013 your daily record didn\u2019t change.'),
   (mode==='daily'&&Object.keys(rec.missed).length)?h('p',null,'Types to keep practicing: '+Object.keys(rec.missed).map(function(k){return G.KIND_LABELS[k];}).join(', ')+'.'):null,
   mode==='daily'?h('div',{class:'tip'},'\uD83D\uDCC5 Come back tomorrow for a brand-new set of 10 questions!'):null),
  h('div',{class:'card'},h('h2',null,'\uD83D\uDCCB Review today\u2019s questions'),h('p',{class:'small'},'Tap a question to see how it works.'),reviewList(rec),
   (mode==='daily'||mode==='retry')&&todayRec()?btn('\uD83D\uDD01 Try today\u2019s questions again','blue',function(){var r=todayRec();if(r&&r.questions){startQuiz('retry',r.questions.map(function(q){var c={};for(var k in q)c[k]=q[k];delete c.userAnswer;return c;}));}}):null,
   btn('\uD83D\uDCAA Practice more','alt',function(){startQuiz('practice');}),
   mode!=='daily'?btn('\u2B05 Back to home','gray',render):null),
  parentCorner()];
 show(nodes);}
function todayRec(){var r=recFor(today());return r&&r.questions?r:null;}
/* ---------- home ---------- */
function render(){
 Q=null;store=load();var rec=recFor(today());
 if(rec){renderResults(rec,'daily');return;}
 var ip=store.inProgress;
 if(ip&&ip.date===today()&&ip.answers&&ip.answers.length>0){
  show([h('h1',null,'Daily Math Quiz'),h('div',{class:'card pop'},h('h2',null,'Welcome back! \uD83D\uDC4B'),h('p',null,'You\u2019re on question '+(ip.answers.length+1)+' of '+TOTAL+'.'),
   btn('Keep going \u25B6','go',resumeDaily,'resume')),parentCorner()]);return;}
 var first=isFirst(),f=focusText(missedFocus()),ds=dayStreak();
 show([h('h1',null,'\uD83E\uDDE0 Daily Math Quiz'),h('div',{class:'sub'},'True or False? Is the mystery number right?'),
  h('div',{class:'card pop'},
   h('div',{class:'row'},h('span',{class:'badge'},first?'Level 1 to start':lvName(store.level)),ds?h('span',{class:'badge'},'\uD83D\uDD25 '+ds+' day streak'):null),
   h('h2',null,first?'Hi, math star! \uD83D\uDC4B':'Ready for today\u2019s 10?'),
   h('p',null,first?'Each question gives you a number for a letter. Is the equation true or false when you use that number? We start easy and the questions get harder as you do well!':'10 new questions are waiting. They start a little easier and get harder as you get them right.'),
   (!first&&f.length)?h('p',{class:'small'},'\uD83C\uDFAF Extra practice today on: '+f.join(', ')):null,
   h('div',{class:'tip'},'Example: If M = 49, is M \u00F7 7 = 7 true? Plug it in: 49 \u00F7 7 = 7. Yes, TRUE!'),
   btn('Start today\u2019s quiz \u25B6','go',function(){startQuiz('daily');},'start')),
  parentCorner()]);}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!Q){render();}});
render();
window.__quiz={store:function(){return store;},render:render};
})();

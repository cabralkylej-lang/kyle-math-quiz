/* ---------- random ---------- */
function hashSeed(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}

function N(n){return {t:'n',v:n};}

 var l=show(n.a,name),r=show(n.b,name);if(needs(n.a,n,false))l='('+l+')';if(needs(n.b,n,true))r='('+r+')';return l+' '+n.op+' '+r;}

 collect(n.a,depth+(needs(n.a,n,false)?1:0),out);
 if(n.a.t==='n'&&n.b.t==='n')out.push({node:n,depth:depth});
 collect(n.b,depth+(needs(n.b,n,true)?1:0),out);}

 while(n.t==='o'&&guard++<20){var c=[];collect(n,0,c);var best=null;
  for(var i=0;i<c.length;i++){var x=c[i];if(!best||x.depth>best.depth||(x.depth===best.depth&&PREC[x.node.op]>PREC[best.node.op]))best=x;}
  var nd=best.node;var before=show(nd,'?');var val=evalN(nd,0);

function unwind(node,T,name){var pre=[],lines=[],chain=[],cur=node,target=T;

  if(other.t==='o')pre.push('First work out the number part: '+show(other,name)+' = '+c+'.');

   else{nw=c-target;txt=c+' '+MINUS+' ? = '+target+'. What did we take away from '+c+'? '+c+' '+MINUS+' '+target+' = '+nw;}}

   else{nw=c/target;txt=c+' '+DIV+' ? = '+target+'. How many in each group? '+c+' '+DIV+' '+target+' = '+nw;}}

function recentTexts(){var out=[];store.history.slice(-3).forEach(function(r){(r.texts||[]).forEach(function(t){out.push(t);});});return out;}
function levelsSoFar(){return Q.answers.map(function(a,i){return a===Q.qs[i].truth;});}
function isPractice(){return Q&&Q.mode==='practice';}
function perScreen(){return isPractice()?Q.B:TOTAL;}
function posInScreen(){return isPractice()?Q.idx%Q.B:Q.idx;}
function lastOfScreen(){return posInScreen()>=perScreen()-1;}
function topicName(t){return Topics.registry[t]?Topics.registry[t].short:t;}
function topicLevelName(t,l){var T=Topics.registry[t];return 'Level '+l+(T&&T.levelNames[l-1]?' \u2013 '+T.levelNames[l-1]:'');}
function ensureQuestion(){
 if(Q.qs[Q.idx])return;
 if(Q.mode==='retry')return;
 var avoid=Q.qs.map(function(q){return q.text;}).concat(recentTexts()),q;
 if(Q.mode==='daily'){
  var t=Q.plan[Q.idx],results=levelsSoFar().slice(0,Q.idx);
  var level=t==='algebra'?Engine.slotLevel(store,Q.plan,Q.idx,Q.base,Q.first,results):Math.max(1,Math.min(Topics.maxLevelOf(t),(Q.wl&&Q.wl[t])||1));
  q=Topics.make(t,{seed:Engine.slotSeed(Q.date,t,level,Q.idx),level:level,wantTrue:Q.sched[Q.idx],weights:Q.first?null:Q.snap,avoid:avoid});}
 else{ /* practice: the ramp decides the level; weights favour this topic's weak skills (and the focus skill) */
  var ps=Q.ps;
  q=Topics.make(Q.topic,{seed:'practice|'+Q.nonce+'|'+Q.topic+'|L'+ps.level+'|q'+Q.idx,level:ps.level,wantTrue:Q.sched[Q.idx%10],weights:Engine.practiceWeights(store,ps,Q.date),avoid:avoid.slice(-30)});}
 Q.qs[Q.idx]=q;}
function persist(){if(Q.mode!=='daily')return;
 store.inProgress={date:Q.date,base:Q.base,first:Q.first,sched:Q.sched,plan:Q.plan,snap:Q.snap,wl:Q.wl,qs:Q.qs,answers:Q.answers,streak:Q.streak,best:Q.best};save();enqueue({inProgress:store.inProgress});}
function workLevels(){var o={};Topics.order.forEach(function(t){o[t]=Engine.workLevel(store,t);});return o;}
function startQuiz(mode,fixedQs){
 var date=today();
 if(mode==='daily'&&recFor(date)){render();return;} /* today's score is final */
 var first=mode==='daily'&&isFirst();
 Q={mode:mode,date:date,base:store.level,first:first,sched:G.schedule(date+'|'+store.level+'|'+mode),
  qs:fixedQs?fixedQs.map(function(q){return q;}):[],answers:[],idx:0,streak:0,best:0,nonce:String(Date.now())};
 if(mode==='daily'){var pl=Engine.planDaily(store,{date:date,first:first,total:TOTAL});Q.plan=pl.plan;Q.snap=pl.snap;Q.wl=workLevels();}
 renderQuestion();}
function resumeDaily(){var ip=store.inProgress;
 var plan=Array.isArray(ip.plan)&&ip.plan.length===TOTAL?ip.plan:Array.apply(null,Array(TOTAL)).map(function(){return 'algebra';}); /* quizzes started before topics existed were all algebra */
 Q={mode:'daily',date:ip.date,base:ip.base,first:ip.first,sched:ip.sched,plan:plan,snap:ip.snap||{},wl:ip.wl||workLevels(),qs:ip.qs.map(Topics.decorate),answers:ip.answers,idx:ip.answers.length,streak:ip.streak,best:ip.best,nonce:''};
 Q.qs=Q.qs.slice(0,Q.answers.length);
 if(Q.idx>=TOTAL)finishQuiz();else renderQuestion();}
/* ---------- practice sessions: the kid picks a topic; batches of 5 or 10; the level ramps up with success ---------- */
function newSid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function masteredSet(){var o={};Object.keys(Topics.catalog).forEach(function(k){var s=store.skills[k];if(s&&s.m)o[k]=1;});return o;}
function startPracticeSession(topic,focusKind){
 var ps=Engine.startPractice(store,topic,today(),newSid(),focusKind);
 Q={mode:'practice',date:today(),topic:topic,ps:ps,B:batchSize,batch:1,sched:G.schedule('practice|'+Date.now()+'|'+topic),qs:[],answers:[],notes:[],idx:0,streak:0,best:0,nonce:String(Date.now()),m0:masteredSet(),bStart:0};
 renderQuestion();}
function recordPractice(q,val,ok){
 var ps=Q.ps,before=ps.level,lv0=Engine.workLevel(store,Q.topic);
 var ev=Engine.answerPractice(store,ps,{kind:q.kind,level:q.level,correct:ok,date:Q.date});
 var note='';
 if(ev.promoted)note='\uD83C\uDF89 You unlocked '+topicLevelName(Q.topic,Engine.workLevel(store,Q.topic))+' for your daily quiz!';
 else if(ps.level>before)note='\u2B06\uFE0F Level up! Your next one is Level '+ps.level+'.';
 else if(ps.level<before)note='\uD83D\uDD3D Let\u2019s try a slightly easier one next, then climb back up.';
 Q.notes[Q.idx]=note;
 var item={seq:Q.idx+1,batch:Q.batch,kind:q.kind,level:q.level,truth:q.truth,answer:val,text:String(q.text).slice(0,400),ts:Date.now()+skew};
 var p={practice:{sid:ps.sid,day:Q.date,items:[item]},adapt:JSON.parse(JSON.stringify(Engine.adaptBlob(store)))};
 if(Q.topic==='algebra'&&Engine.workLevel(store,'algebra')!==lv0)p.level=store.level;
 enqueue(p);}
function renderPracticeHome(){
 Q=null;var today_=today();
 var cards=Topics.order.map(function(t){var T=Topics.registry[t],sm=Engine.topicSummary(store,t,today_);
  var sub=sm.pa?(sm.pa+' practiced \u00B7 best Level '+sm.pb+' \u00B7 \u2B50 '+sm.mastered+'/'+sm.total):'Not tried yet \u2013 give it a go!';
  return h('button',{class:'btn topic',type:'button',id:'pt-'+t,onclick:function(){startPracticeSession(t);}},
   h('span',{class:'te'},T.emoji),h('span',{class:'tt'},h('b',null,T.name),h('small',null,topicLevelName(t,sm.work)+' \u2022 '+sub)));});
 var b5=h('button',{class:'seg'+(batchSize===5?' on':''),type:'button',id:'bs5',onclick:function(){batchSize=5;renderPracticeHome();}},'5 questions'),
     b10=h('button',{class:'seg'+(batchSize===10?' on':''),type:'button',id:'bs10',onclick:function(){batchSize=10;renderPracticeHome();}},'10 questions');
 show([h('h1',null,'\uD83D\uDCAA Practice'),
  h('div',{class:'card pop'},h('p',{class:'msg'},'Pick a topic. Questions get harder as you get them right, and easier after a miss, so you always learn at just the right level.'),
   h('p',{class:'small',style:'text-align:center'},'How many in a round?'),h('div',{class:'segs'},b5,b10),
   h('div',{id:'topics'},cards),
   h('p',{class:'small',style:'text-align:center'},'Practice never changes your daily score. But what you practice helps pick tomorrow\u2019s questions!'),
   btn('\u2B05 Back','gray',render,'pback'))]);}
function renderBatch(){
 var from=Q.idx-Q.B+1,n=0;for(var i=from;i<=Q.idx;i++)if(Q.answers[i]===Q.qs[i].truth)n++;
 var ps=Q.ps,newM=[];Object.keys(Topics.catalog).forEach(function(k){var s=store.skills[k];if(s&&s.m&&!Q.m0[k])newM.push(kl(k));});
 var msg=n===Q.B?'PERFECT round! \uD83E\uDD29':n>=Q.B*0.8?'Amazing! \uD83C\uDF1F':n>=Q.B*0.6?'Nice work! \uD83D\uDE0A':'Good effort \u2013 every try makes you stronger! \uD83C\uDF31';
 var lines=[h('p',{class:'big',id:'bscore'},n+' / '+Q.B),h('p',{class:'msg'},msg),
  h('p',{id:'blevel'},'\uD83D\uDCC8 You reached '+topicLevelName(Q.topic,ps.best||ps.level)+' this session'+(ps.start<(ps.best||ps.level)?' (you started at Level '+ps.start+')':'')+'. Next question: Level '+ps.level+'.'),
  h('p',{class:'small'},'Session so far: '+ps.correct+' of '+ps.total+' right ('+Math.round(100*ps.correct/Math.max(1,ps.total))+'%).')];
 if(ps.promoted)lines.push(h('div',{class:'msg',id:'promo'},'\uD83C\uDF89 You unlocked '+topicLevelName(Q.topic,Engine.workLevel(store,Q.topic))+' for your daily quiz!'));
 if(newM.length)lines.push(h('div',{class:'msg',id:'newmastery'},'\u2B50 Mastered: '+newM.join(', ')+'! You got it right three times in a row. We\u2019ll show it less often now.'));
 show([h('h1',null,'Round done!'),h('div',{class:'card pop'},lines,
  btn('Keep going (' +Q.B+' more) \u27A1','go',function(){Q.batch++;Q.idx++;Q.bStart=Q.idx;renderQuestion();},'keepgoing'),
  btn('\uD83D\uDD00 Switch topic','blue',renderPracticeHome,'switchtopic'),
  btn('\u2705 I\u2019m done','gray',render,'pdone'))]);}
function renderReminder(){
 Q=null;
 show([h('h1',null,'\u270B Before you start'),
  h('div',{class:'card pop'},h('h2',{style:'text-align:center'},'Ready, '+(kid||'math star')+'?'),
   h('div',{class:'msg',id:'reminder'},'Take your time, think carefully. Your final score is final: once you answer, you can\u2019t change it. No cheating, do your own best work!'),
   btn('I\u2019m ready','go',function(){startQuiz('daily');},'ready'),
   btn('\u2B05 Back','gray',render,'reminderback'))]);}
/* ANSWER MODES: how a question is answered. 'tf' = tap True/False (today). FUTURE ("show your work"): add a 'work' mode here that renders a
   text area for the steps + a final-answer box and calls answer(val,{work:text}) (extend answer(val,extra) to keep extra.work with the answer); set q.answerMode='work' on written-problem kinds
   (see ROADMAP.md). Nothing else in the quiz flow has to change. */
var ANSWER_MODES={

  h('div',{class:'tf'},
   h('button',{class:'btn t',type:'button',id:'btnT',disabled:answered?'disabled':null,onclick:function(){answer(true);}},'\u2714 True'),
   h('button',{class:'btn f',type:'button',id:'btnF',disabled:answered?'disabled':null,onclick:function(){answer(false);}},'\u2718 False'))];}
};
function disableAnswerButtons(){['btnT','btnF'].forEach(function(id){var b=document.getElementById(id);if(b)b.disabled=true;});}
function renderQuestion(){
 ensureQuestion();var q=Q.qs[Q.idx];var answered=Q.answers[Q.idx]!==undefined,tot=perScreen(),pos=posInScreen();
 var title={daily:'Daily Quiz',practice:'Practice: '+topicName(Q.topic||''),retry:'Practice again'}[Q.mode];
 var long=q.stmt.length>30;
 var pills=[h('span',{class:'pill'},'Question '+(pos+1)+' of '+tot),h('span',{class:'pill',id:'streak'},'\uD83D\uDD25 Streak: '+Q.streak),h('span',{class:'pill',id:'lvpill'},'Level '+q.level)];
 if(isPractice())pills.push(h('span',{class:'pill',id:'sesslv'},'\uD83D\uDCC8 Best: Level '+(Q.ps.best||q.level)));
 var nodes=[h('h1',null,title),
  h('div',{class:'card pop'},
   h('div',{class:'top'},pills),
   h('div',{class:'progress',role:'progressbar','aria-valuemin':'0','aria-valuemax':String(tot),'aria-valuenow':String(pos+(answered?1:0))},h('i',{style:'width:'+((pos+(answered?1:0))/tot*100)+'%'})),
   (Q.mode!=='daily'||q.topic!=='algebra')?h('div',{class:'tag',id:'qtag'},Topics.registry[q.topic]?Topics.registry[q.topic].emoji+' '+Topics.registry[q.topic].short+' \u00B7 '+(q.label||''):''):null,
   q.prompt?h('div',{class:'if',id:'prompt'},q.prompt):null,
   h('div',{class:'eq'+(long?' txt':''),id:'eq'},q.stmt),
   ANSWER_MODES[q.answerMode||'tf'](q,answered),
   h('div',{id:'fb'}))];
 show(nodes);
 if(Q.mode==='retry')nodes[1].appendChild(h('p',{class:'small'},'This is just practice \u2013 it doesn\u2019t change your saved score.'));
 if(isPractice())nodes[1].appendChild(h('p',{class:'small'},'Practice questions don\u2019t change your daily score \u2013 they help pick tomorrow\u2019s questions.'));
 if(answered)renderFeedback();}
function answer(val){
 if(Q.answers[Q.idx]!==undefined)return;var q=Q.qs[Q.idx];Q.answers[Q.idx]=val;var ok=(val===q.truth);
 if(ok){Q.streak++;if(Q.streak>Q.best)Q.best=Q.streak;}else Q.streak=0;
 if(isPractice())recordPractice(q,val,ok);
 persist();disableAnswerButtons();
 var st=document.getElementById('streak');st.textContent='\uD83D\uDD25 Streak: '+Q.streak;
 var sl=document.getElementById('sesslv');if(sl)sl.textContent='\uD83D\uDCC8 Best: Level '+(Q.ps.best||q.level);
 var bar=document.querySelector('.progress i');bar.style.width=((posInScreen()+1)/perScreen()*100)+'%';
 renderFeedback();}
var CHEERS=['Awesome!','Nice one!','You got it!','Brilliant!','Super!','Way to go!','Yes!','Math star!'];
function renderFeedback(){var q=Q.qs[Q.idx],val=Q.answers[Q.idx],ok=(val===q.truth),box=document.getElementById('fb');box.innerHTML='';
 var last=lastOfScreen();
 var next=btn(last?(isPractice()?'See my round \uD83C\uDF89':'See my results \uD83C\uDF89'):'Next question \u27A1','go',function(){if(last){if(isPractice())renderBatch();else finishQuiz();}else{Q.idx++;renderQuestion();}},'next');
 var fb,note=isPractice()&&Q.notes[Q.idx]?h('p',{class:'lvnote',id:'lvnote'},Q.notes[Q.idx]):null;
 if(ok){var extra=Q.streak>=5?' \uD83D\uDD25 '+Q.streak+' in a row!':Q.streak===3?' \uD83D\uDD25 3 in a row!':'';
  fb=h('div',{class:'fb good pop',id:'good'},h('h3',null,'\u2705 '+CHEERS[(Q.idx*3+q.level)%CHEERS.length]+' Correct!'+extra),h('p',null,q.shortExpl),note);}
 else{
  var said=val?'True':'False',really=q.truth?'True':'False';
  fb=h('div',{class:'fb try pop',id:'wrong'},
   h('h3',null,'\uD83D\uDCAA Great try! Let\u2019s figure it out together.'),
   h('p',null,'You tapped '+said+', but the answer is '+really+'. Here\u2019s why:'),
   Topics.sectionsOf(q).map(function(s){return [h('h3',null,s.t),s.h?h('p',{class:'small'},s.h):null,stepsList(s.l)];}),

/* ---------- finishing ---------- */
function withAnswers(){return Q.qs.map(function(q,i){var c={};for(var k in q)c[k]=q[k];c.userAnswer=Q.answers[i];return c;});}
function finishQuiz(){
 var results=levelsSoFar(),score=results.filter(Boolean).length,missed={};
 Q.qs.forEach(function(q,i){if(!results[i])missed[q.kind]=(missed[q.kind]||0)+1;});
 if(Q.mode==='daily'){
  var algRes=results.filter(function(x,i){return Q.plan[i]==='algebra';});
  var endLevel=G.nextQuestionLevel(Q.base,Q.first,algRes);
  var nd=Engine.algebraNextDay(Q.base,Q.first,endLevel,Q.plan,results).next; /* the algebra level moves on the algebra questions only */
  var rec={date:Q.date,startLevel:Q.base,first:Q.first,score:score,total:TOTAL,missed:missed,levelAfter:nd.level,change:nd.change,best:Q.best,
   texts:Q.qs.map(function(q){return q.text;}),qz:Topics.pack(withAnswers())};
  var resQ=Q.qs.map(function(q,i){return {kind:q.kind,level:q.level,text:String(q.text).slice(0,400),truth:q.truth,answer:Q.answers[i]};});
  if(!recFor(Q.date)){
   Q.qs.forEach(function(q,i){Engine.applyOutcome(store,{kind:q.kind,level:q.level,correct:results[i],date:Q.date,sid:'d'+Q.date,mode:'daily'});}); /* the daily answers feed the same memory as practice */
   store.history.push(rec);store.level=nd.level;store.inProgress=null;prune();save();
   enqueue({rec:rec,result:{questions:resQ},level:nd.level,adapt:JSON.parse(JSON.stringify(Engine.adaptBlob(store)))});
   flush().then(function(){if(lostRace){lostRace=false;resync(true);}});}
  renderResults(recFor(Q.date)||rec,'daily');}
 else{renderResults({date:Q.date,startLevel:Q.base,score:score,total:TOTAL,missed:missed,best:Q.best,questions:withAnswers()},Q.mode);}}
function levelMsg(rec){var n=rec.levelAfter;
 if(rec.change==='placement')return '\uD83C\uDFAF That was your first quiz, so it started easy and climbed. Tomorrow we\u2019ll start at '+lvName(n)+'.';
 if(rec.change==='up')return '\uD83C\uDF89 LEVEL UP! Tomorrow you start '+lvName(n)+'. Great job!';
 if(rec.change==='top')return '\uD83C\uDFC6 You\u2019re at the top level \u2013 Math Wizard! Tomorrow: more Level 10 challenges.';
 if(rec.change==='down')return '\uD83C\uDF31 Tomorrow we\u2019ll step back to '+lvName(n)+' to make your skills rock-solid. Even math pros review!';

 var f=focusText(rec.missed);return '\uD83D\uDC4D You\u2019ll stay at '+lvName(n)+' tomorrow.'+(f.length?' We\u2019ll practice '+f.join(' and ')+' a bit more.':' Keep it up!');}
function scoreMsg(s){return s===10?'PERFECT! \uD83E\uDD29':s>=9?'Amazing! \uD83C\uDF1F':s>=7?'Great job! \uD83D\uDE0A':s>=5?'Nice work! Keep going! \uD83D\uDCAA':'Good effort! Every try makes you stronger! \uD83C\uDF31';}

  h('div',{class:'inner'},h('p',null,'You said '+(q.userAnswer?'True':'False')+'. '+q.shortExpl),
   ok?null:[Topics.sectionsOf(q).map(function(sc){return [h('h3',null,sc.t),stepsList(sc.l)];}),q.tip?h('div',{class:'tip'},'\uD83D\uDCA1 '+q.tip):null]));return d;});}
/* "Algebra 5/6 / Fractions 1/2" for a finished quiz */

function todayRec(){var r=recFor(today());return r&&questionsOf(r)?r:null;}

/* ---------- my history ---------- */
function avgPct(){var hh=store.history;if(!hh.length)return 0;var t=0;hh.forEach(function(r){t+=pct(r);});return Math.round(t/hh.length);}
function last7Avg(){var hh=store.history.slice(-7);if(!hh.length)return 0;var t=0;hh.forEach(function(r){t+=pct(r);});return Math.round(t/hh.length);}
function histBtn(){return btn('\uD83D\uDCC8 My History','blue',renderHistory,'histbtn');}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function prettyDate(d){var x=new Date(d+'T12:00:00');if(isNaN(x.getTime()))return d;return DOW[x.getDay()]+', '+MON[x.getMonth()]+' '+x.getDate()+', '+x.getFullYear();}
function shortDate(d){var x=new Date(d+'T12:00:00');if(isNaN(x.getTime()))return d;return (x.getMonth()+1)+'/'+x.getDate();}
function pctColor(p){return p>=90?'#00b894':p>=70?'#6c5ce7':p>=50?'#fdcb6e':'#ff7675';}
function pctText(p){return p>=50&&p<70?'#d9822b':pctColor(p);}
function svgEl(tag,attrs,text){var e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e;}
/* bars = each quiz %, line = running average % of every quiz up to that day */
function runningAvgs(){var t=0;return store.history.map(function(r,i){t+=pct(r);return Math.round(t/(i+1));});}
function trendChart(recs,runs){
 var W=340,H=180,top=22,bot=30,ch=H-top-bot,n=recs.length,slot=W/Math.max(n,7),bw=Math.min(36,slot*0.66),few=n<=8;
 var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'chart',role:'img','aria-label':'Chart of your last '+n+' quiz scores in percent, with your running average'});
 [0,50,100].forEach(function(g){var y=top+ch-ch*g/100;svg.appendChild(svgEl('line',{x1:0,x2:W,y1:y,y2:y,stroke:'#e8e6ff','stroke-width':g===0?2:1}));});
 var pts=[];

/* ---------- profiles, PIN, login ---------- */
function keypad(onDone){
 var val='',busy=false;
 var dots=h('div',{class:'dots',id:'dots'},[0,1,2,3].map(function(){return h('i',null);}));
 function paint(){for(var i=0;i<4;i++)dots.children[i].className=i<val.length?'on':'';}
 function reset(){val='';busy=false;paint();}
 function press(c){if(busy||val.length>=4)return;val+=c;paint();if(val.length===4){busy=true;onDone(val,reset);}}
 function back(){if(busy)return;val=val.slice(0,-1);paint();}
 var keys=['1','2','3','4','5','6','7','8','9','','0','\u232B'].map(function(c){
  if(c==='')return h('span');
  return h('button',{type:'button',class:'key',id:c==='\u232B'?'kback':'k'+c,'aria-label':c==='\u232B'?'delete':c,onclick:function(){if(c==='\u232B')back();else press(c);}},c);});
 nextKH=function(e){if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')back();};
 return h('div',null,dots,h('div',{class:'pad'},keys));}
function renderPicker(msg){

 show([h('h1',null,'\uD83E\uDDE0 Daily Math Quiz'),h('div',{class:'sub'},'True or False? Is the mystery number right?'),
  h('div',{class:'card pop'},h('h2',{style:'text-align:center'},'Who\u2019s playing today?'),

  h('p',{class:'small',style:'text-align:center'},'Remember it! You\u2019ll type it each time you play.')));

function renderPin(name,msg){

  pinMsg('Checking\u2026');
  api({action:'login',kid:name,pin:pin}).then(function(r){
   if(r.s===200&&r.j.token){enterSession(name,r.j.token);return;}
   if(r.s===404){renderSetPin(name);return;}
   if(r.s===401){pinMsg('Oops, that\u2019s not it. '+r.j.attemptsLeft+(r.j.attemptsLeft===1?' try':' tries')+' left.');reset();return;}
   if(r.s===429){pinMsg('Too many tries. Take a break and try again in '+Math.max(1,Math.ceil((r.j.retryAfter||300)/60))+' minutes.');reset();return;}
   pinMsg(r.net?'We can\u2019t reach the internet. Try again in a moment.':'Something went wrong. Please try again.');reset();});});

/* pull the saved state from the server (source of truth) */
function resync(rerender){
 if(!token)return Promise.resolve();
 return api({action:'load',token:token}).then(function(r){
  if(r.s===401){token=null;try{sessionStorage.removeItem(SS);}catch(e){}renderPin(kid,'Please type your PIN again.');return;}
  if(r.s===200){
   if(!pending.length){var s=adopt(normalize(r.j.state));store=s||blank();save();setSync('saved');}
   if(!store.history.length&&legacyData()&&lsGet('kyleMathQuiz.skip.'+kid)!=='1'){renderImportPrompt();return;}
   render();return;}
  /* offline or server trouble: use the cached copy */
  setSync('offline');retryTimer=setTimeout(flush,15000);render();});}

  if(r.s===409){lsSet('kyleMathQuiz.skip.'+kid,'1');render();return;}
